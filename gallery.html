<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <title>Galleria | Luca Silvestrini</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- CSS personalizzato -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="text-center py-3">
    <h1>Luca Silvestrini</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="contact.html">Contatti</a>
    </nav>
  </header>

  <main class="gallery container py-4">

    <!-- BLOCCO DI PROVA -->
    <section class="gallery-block mb-5">

      <!-- Titolo + meta -->
      <div class="mb-3 text-center">
        <p class="meta text-muted">Venezia · 27 dicembre 2025</p>
      </div>

      <!-- CAROUSEL -->
      <div id="carouselTest" class="carousel slide" data-ride="carousel" data-interval="3000" data-wrap="true">

        <div class="carousel-inner text-center">

          <div class="carousel-item active">
            <img src="img/foto1.webp" class="img-fluid" alt="" loading="lazy">
          </div>

          <div class="carousel-item">
            <img src="img/foto2.webp" class="img-fluid" alt="" loading="lazy">
          </div>

          <div class="carousel-item">
            <img src="img/foto3.webp" class="img-fluid" alt="" loading="lazy">
          </div>

          <div class="carousel-item">
            <img src="img/foto4.webp" class="img-fluid" alt="" loading="lazy">
          </div>

        </div>

        <!-- Frecce -->
        <a class="carousel-control-prev" href="#carouselTest" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </a>

        <a class="carousel-control-next" href="#carouselTest" role="button" data-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a>

      </div>
      <!-- FINE CAROUSEL -->

    </section>
    <!-- FINE BLOCCO DI PROVA -->

  </main>

  <footer class="text-center py-3">
    <p>© 2026 Luca Silvestrini</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
