<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <title>Luca Silvestrini | Fotografia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <h1>Luca Silvestrini</h1>
    <nav>
      <a href="index.html">Galleria</a>
      <a href="about.html">Chi sono</a>
      <a href="contact.html">Contatti</a>
    </nav>
  </header>

  <main class="gallery container py-4">

    <!-- CAROUSEL LANDSCAPE (3:2) -->
    <div id="carouselLandscape" class="carousel slide mb-4" data-ride="carousel" data-interval="3000" data-wrap="true">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="img/3by2/foto1.webp" class="d-block w-100" alt="">
        </div>
        <div class="carousel-item">
          <img src="img/3by2/foto2.webp" class="d-block w-100" alt="">
        </div>
        <div class="carousel-item">
          <img src="img/3by2/foto3.webp" class="d-block w-100" alt="">
        </div>
        <div class="carousel-item">
          <img src="img/3by2/foto4.webp" class="d-block w-100" alt="">
        </div>
        <div class="carousel-item">
          <img src="img/3by2/foto5.webp" class="d-block w-100" alt="">
        </div>
      </div>
      <a class="carousel-control-prev" href="#carouselLandscape" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
      </a>
      <a class="carousel-control-next" href="#carouselLandscape" role="button" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
      </a>
    </div>

    <!-- CAROUSEL PORTRAIT (2:3) -->
    <div id="carouselPortrait" class="carousel slide" data-ride="carousel" data-interval="3500" data-wrap="true">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="img/2by3/foto1.webp" class="d-block w-100" alt="">
        </div>
        <div class="carousel-item">
          <img src="img/2by3/foto2.webp" class="d-block w-100" alt="">
        </div>
        <div class="carousel-item">
          <img src="img/2by3/foto3.webp" class="d-block w-100" alt="">
        </div>
        <div class="carousel-item">
          <img src="img/2by3/foto4.webp" class="d-block w-100" alt="">
        </div>
        <div class="carousel-item">
          <img src="img/2by3/foto5.webp" class="d-block w-100" alt="">
        </div>
      </div>
      <a class="carousel-control-prev" href="#carouselPortrait" role="button" data-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
      </a>
      <a class="carousel-control-next" href="#carouselPortrait" role="button" data-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
      </a>
    </div>

  </main>

  <footer class="text-center py-3">
    <p>© 2026 Luca Silvestrini</p>
  </footer>

  <!-- Bootstrap JS e dipendenze -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
